version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: palmpay-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - palmpay-network

  palm_ml:
    build:
      context: ./palm_ml
      dockerfile: Dockerfile
    container_name: palmpay-ml
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ML_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5000,http://127.0.0.1:5000,http://localhost,http://127.0.0.1
    volumes:
      - keras_cache:/root/.keras/models
    networks:
      - palmpay-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: palmpay-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/palm_pay
      - ML_SERVICE_URL=http://palm_ml:8000
      - JWT_SECRET=${JWT_SECRET} # Provide in .env or secrets manager
      - MATCH_THRESHOLD_VERIFY=0.65
      - MATCH_THRESHOLD_IDENTIFY=0.78
    depends_on:
      - mongodb
      - palm_ml
    networks:
      - palmpay-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: palmpay-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - palmpay-network

volumes:
  mongo_data:
  keras_cache:

networks:
  palmpay-network:
    driver: bridge
